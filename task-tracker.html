<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMP Student Task Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f0e0c;
    --paper: #f5f0e8;
    --cream: #ede7d5;
    --accent: #c94a2e;
    --gold: #b8913a;
    --line: #d4cdb8;
    --mono: 'Plus Jakarta Sans', sans-serif;
    --serif: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px);
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding: 3rem 0 2.5rem;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 2.5rem;
    position: relative;
  }

  header::before {
    content: '— UNIVERSITY OF MPUMALANGA —';
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    display: block;
    margin-bottom: 0.75rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
  }

  header p {
    margin-top: 0.75rem;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    color: #666;
  }

  /* FORM */
  .form-card {
    background: white;
    border: 1.5px solid var(--ink);
    padding: 2rem 2rem 1.75rem;
    margin-bottom: 2rem;
    position: relative;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .form-card::before {
    content: 'NEW ENTRY';
    position: absolute;
    top: -0.6rem;
    left: 1.5rem;
    background: var(--accent);
    color: white;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    padding: 0.1rem 0.6rem;
    font-weight: 500;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr 120px;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  @media (max-width: 560px) {
    .fields { grid-template-columns: 1fr; }
  }

  .field label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    margin-bottom: 0.4rem;
    color: var(--gold);
    font-weight: 500;
  }

  .field input {
    width: 100%;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-bottom-color: var(--ink);
    padding: 0.55rem 0.75rem;
    font-family: var(--mono);
    font-size: 0.88rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .field input:focus {
    border-color: var(--accent);
    background: white;
  }

  .field input::placeholder { color: #bbb; }

  .btn-add {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.6rem 1.8rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .btn-add:hover { background: var(--accent); }
  .btn-add:active { transform: scale(0.97); }

  /* ERROR */
  .error-msg {
    font-size: 0.75rem;
    color: var(--accent);
    margin-top: 0.5rem;
    min-height: 1rem;
    letter-spacing: 0.05em;
  }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
  }

  @media (max-width: 460px) { .stats { grid-template-columns: 1fr 1fr; } }

  .stat {
    background: white;
    border: 1.5px solid var(--line);
    padding: 1rem 1.25rem;
    text-align: center;
  }

  .stat-num {
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 600;
    color: var(--accent);
    display: block;
    line-height: 1;
  }

  .stat-lbl {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    color: #888;
    margin-top: 0.3rem;
    display: block;
  }

  /* RECORDS */
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1rem;
  }

  .records-header h2 {
    font-family: var(--serif);
    font-size: 1.4rem;
    font-weight: 600;
  }

  .btn-clear {
    background: none;
    border: 1px solid var(--line);
    color: #999;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    padding: 0.25rem 0.7rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .btn-clear:hover { color: var(--accent); border-color: var(--accent); }

  /* FILTER */
  .filter-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: none;
    border: 1.5px solid var(--line);
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    padding: 0.3rem 0.9rem;
    cursor: pointer;
    color: #888;
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* TABLE */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    font-weight: 500;
    padding: 0.5rem 0.75rem;
    text-align: left;
    border-bottom: 2px solid var(--ink);
  }

  tbody tr {
    border-bottom: 1px solid var(--line);
    transition: background 0.1s;
    animation: rowIn 0.3s ease both;
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  tbody tr:hover { background: white; }

  tbody td {
    padding: 0.65rem 0.75rem;
    vertical-align: middle;
  }

  .badge {
    display: inline-block;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    padding: 0.15rem 0.55rem;
    border: 1px solid;
  }

  .badge-high   { color: #1a7a3e; border-color: #1a7a3e; background: #eaf7ee; }
  .badge-mid    { color: #8a6200; border-color: #c99a00; background: #fdf8e3; }
  .badge-low    { color: var(--accent); border-color: var(--accent); background: #fdf0ed; }

  .score-bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .score-bar {
    flex: 1;
    height: 4px;
    background: var(--line);
    max-width: 80px;
  }

  .score-bar-fill {
    height: 100%;
    background: var(--ink);
    transition: width 0.5s ease;
  }

  .btn-del {
    background: none;
    border: none;
    cursor: pointer;
    color: #ccc;
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s;
    padding: 0 0.25rem;
  }

  .btn-del:hover { color: var(--accent); }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: #bbb;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    border: 1.5px dashed var(--line);
  }

  .empty span {
    display: block;
    font-family: var(--serif);
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    opacity: 0.3;
  }

  /* SAVE NOTICE */
  .save-notice {
    font-size: 0.7rem;
    color: #aaa;
    letter-spacing: 0.1em;
    margin-top: 1.5rem;
    text-align: right;
  }

  .save-notice strong { color: var(--gold); }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Student Task <em>Tracker</em></h1>
    <p>University of Mpumalanga · Academic Record System</p>
  </header>

  <!-- FORM -->
  <div class="form-card">
    <div class="fields">
      <div class="field">
        <label>Student Name</label>
        <input type="text" id="inp-name" placeholder="e.g. Ahmad Zaki" />
      </div>
      <div class="field">
        <label>Module Name</label>
        <input type="text" id="inp-module" placeholder="e.g. Data Structures" />
      </div>
      <div class="field">
        <label>Task Score (0–100)</label>
        <input type="number" id="inp-score" placeholder="85" min="0" max="100" />
      </div>
    </div>
    <button class="btn-add" onclick="addTask()">+ ADD RECORD</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="stat-total">0</span>
      <span class="stat-lbl">TOTAL RECORDS</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-avg">—</span>
      <span class="stat-lbl">AVERAGE SCORE</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-modules">0</span>
      <span class="stat-lbl">MODULES</span>
    </div>
  </div>

  <!-- RECORDS -->
  <div class="records-header">
    <h2>All Records</h2>
    <button class="btn-clear" onclick="clearAll()">CLEAR ALL</button>
  </div>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">ALL</button>
  </div>

  <div class="table-wrap">
    <div id="empty-state" class="empty">
      <span>✎</span>
      NO RECORDS YET — ADD YOUR FIRST ENTRY ABOVE
    </div>
    <table id="records-table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>STUDENT</th>
          <th>MODULE</th>
          <th>SCORE</th>
          <th>GRADE</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="save-notice">
    Records stored in <strong>ArrayList + HashMap</strong> · Auto-saved to <strong>tasks.txt</strong> (localStorage)
  </div>
</div>

<script>
  // ─── DATA STRUCTURES ───────────────────────────────────────────────
  // ArrayList simulation (ordered list)
  const taskArrayList = [];

  // HashMap simulation (student → tasks)
  const taskHashMap = {};

  let currentFilter = 'all';

  // ─── LOAD FROM STORAGE ─────────────────────────────────────────────
  function loadFromFile() {
    try {
      const raw = localStorage.getItem('tasks.txt');
      if (!raw) return;
      const saved = JSON.parse(raw);
      saved.forEach(t => {
        taskArrayList.push(t);
        if (!taskHashMap[t.student]) taskHashMap[t.student] = [];
        taskHashMap[t.student].push(t);
      });
    } catch(e) {}
  }

  function saveToFile() {
    localStorage.setItem('tasks.txt', JSON.stringify(taskArrayList));
  }

  // ─── ADD TASK ───────────────────────────────────────────────────────
  function addTask() {
    const name   = document.getElementById('inp-name').value.trim();
    const module = document.getElementById('inp-module').value.trim();
    const scoreRaw = document.getElementById('inp-score').value.trim();
    const errEl  = document.getElementById('error-msg');

    errEl.textContent = '';

    if (!name)           { errEl.textContent = '⚠ Student name is required.'; return; }
    if (!module)         { errEl.textContent = '⚠ Module name is required.'; return; }
    if (scoreRaw === '') { errEl.textContent = '⚠ Task score is required.'; return; }

    const score = parseFloat(scoreRaw);
    if (isNaN(score) || score < 0 || score > 100) {
      errEl.textContent = '⚠ Score must be between 0 and 100.';
      return;
    }

    const task = {
      id: Date.now(),
      student: name,
      module: module,
      score: score,
      date: new Date().toLocaleDateString('en-GB')
    };

    // ArrayList: push
    taskArrayList.push(task);

    // HashMap: key = student name
    if (!taskHashMap[task.student]) taskHashMap[task.student] = [];
    taskHashMap[task.student].push(task);

    saveToFile();
    clearInputs();
    render();
  }

  function clearInputs() {
    ['inp-name','inp-module','inp-score'].forEach(id =>
      document.getElementById(id).value = ''
    );
    document.getElementById('inp-name').focus();
  }

  // ─── DELETE ─────────────────────────────────────────────────────────
  function deleteTask(id) {
    const idx = taskArrayList.findIndex(t => t.id === id);
    if (idx === -1) return;
    const task = taskArrayList[idx];
    taskArrayList.splice(idx, 1);

    // update hashmap
    if (taskHashMap[task.student]) {
      taskHashMap[task.student] = taskHashMap[task.student].filter(t => t.id !== id);
      if (taskHashMap[task.student].length === 0) delete taskHashMap[task.student];
    }

    saveToFile();
    render();
  }

  function clearAll() {
    if (taskArrayList.length === 0) return;
    if (!confirm('Clear all records?')) return;
    taskArrayList.length = 0;
    Object.keys(taskHashMap).forEach(k => delete taskHashMap[k]);
    saveToFile();
    currentFilter = 'all';
    render();
  }

  // ─── GRADE ──────────────────────────────────────────────────────────
  function grade(score) {
    if (score >= 80) return { lbl: 'A',  cls: 'badge-high' };
    if (score >= 60) return { lbl: 'B',  cls: 'badge-mid'  };
    if (score >= 40) return { lbl: 'C',  cls: 'badge-mid'  };
    return                   { lbl: 'F',  cls: 'badge-low'  };
  }

  // ─── FILTER ─────────────────────────────────────────────────────────
  function setFilter(val, btn) {
    currentFilter = val;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  // ─── RENDER ─────────────────────────────────────────────────────────
  function render() {
    renderStats();
    renderFilters();
    renderTable();
  }

  function renderStats() {
    const total = taskArrayList.length;
    const avg   = total ? (taskArrayList.reduce((s,t) => s+t.score, 0)/total).toFixed(1) : '—';
    const mods  = new Set(taskArrayList.map(t => t.module)).size;

    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-avg').textContent     = avg;
    document.getElementById('stat-modules').textContent = mods;
  }

  function renderFilters() {
    const row = document.getElementById('filter-row');
    const modules = ['all', ...new Set(taskArrayList.map(t => t.module))];

    row.innerHTML = '';
    modules.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (currentFilter === m ? ' active' : '');
      btn.dataset.filter = m;
      btn.textContent = m === 'all' ? 'ALL' : m;
      btn.onclick = () => setFilter(m, btn);
      row.appendChild(btn);
    });

    // keep filter valid
    if (!modules.includes(currentFilter)) currentFilter = 'all';
  }

  function renderTable() {
    const filtered = currentFilter === 'all'
      ? taskArrayList
      : taskArrayList.filter(t => t.module === currentFilter);

    const empty = document.getElementById('empty-state');
    const table = document.getElementById('records-table');
    const tbody = document.getElementById('table-body');

    if (filtered.length === 0) {
      empty.style.display = 'block';
      table.style.display = 'none';
      return;
    }

    empty.style.display = 'none';
    table.style.display = 'table';

    tbody.innerHTML = '';
    filtered.forEach((t, i) => {
      const g = grade(t.score);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:#bbb;font-size:0.75rem">${String(i+1).padStart(2,'0')}</td>
        <td><strong>${esc(t.student)}</strong></td>
        <td style="color:#666">${esc(t.module)}</td>
        <td>
          <div class="score-bar-wrap">
            <span>${t.score}</span>
            <div class="score-bar">
              <div class="score-bar-fill" style="width:${t.score}%"></div>
            </div>
          </div>
        </td>
        <td><span class="badge ${g.cls}">${g.lbl}</span></td>
        <td><button class="btn-del" onclick="deleteTask(${t.id})" title="Remove">×</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── ENTER KEY ──────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // ─── INIT ────────────────────────────────────────────────────────────
  loadFromFile();
  render();
</script>
</body>
</html>
